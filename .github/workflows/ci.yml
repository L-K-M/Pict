name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Added because GitHub throttled webhook delivery during an Actions
  # incident and pull_request events stopped starting workflows at all — dispatch
  # goes through the API instead and is unaffected. Useful beyond the outage too:
  # re-running CI no longer needs an empty commit.
  workflow_dispatch:

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test PictKit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # pinned to match Zap, Jetty and Top Drawer

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  build-app:
    name: Build & Test Pict.app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build & test
        # Unsigned, like the three sibling apps — see their CICD.md. Releases are
        # ad-hoc signed at packaging time, so CI needs no Apple credentials.
        run: |
          set -o pipefail
          xcodebuild \
            -project App/Pict.xcodeproj \
            -scheme Pict \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
